name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/check.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .checks/
          if-no-files-found: ignore
